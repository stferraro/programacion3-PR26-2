[project]
name = "clinica"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["python-dotenv"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C90", # mccabe complexity
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.ruff.lint.mccabe]
max-complexity = 16

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
